      <h1>NeuraOrkesta — Conectamos todo lo que ya usás</h1>
      <p><strong>NeuraOrkesta</strong> digitaliza, conecta y automatiza la gestión de tu PyME para que tengas la foto completa y decidas con datos. Unificamos las herramientas que ya usás —Excel, Drive, tu <strong>ERP</strong>, tu sistema contable, tu banco— sin reemplazar ninguna. Software de gestión con <strong>inteligencia artificial</strong> y <strong>automatizaciones</strong> para PyMEs argentinas.</p>

      <h2>El problema: el dato entra dos veces</h2>
      <p>Tu equipo registra lo que pasa en crudo. Después alguien lo reformatea para que entre en cada sistema, con errores. Eso genera doble trabajo, errores que el sistema toma como válidos, y un costo de capacitación que se repite con cada persona nueva. Son <strong>más de 15 horas por semana por cada empleado administrativo</strong>.</p>

      <h2>Cuatro capas, un solo flujo</h2>
      <p>Neura no elimina la carga de datos: elimina el trabajo de darle formato.</p>
      <ul>
        <li><strong>Neura Sync</strong> — Digitaliza toda la data. Mandá lo que sea (WhatsApp, PDF, Excel sin formato, fotos, mails) y la IA lo interpreta, lo estructura y lo sube al sistema listo para usar. Cero carga manual.</li>
        <li><strong>Neura Core</strong> — Conecta y automatiza los procesos: CRM y oportunidades, tesorería y cobranzas, compras y proveedores, logística y entregas, tareas y flujos de aprobación.</li>
        <li><strong>Integraciones</strong> — Nos conectamos con las herramientas que ya usás: una planilla de Excel, una carpeta de Drive, tu ERP, tu sistema contable, tu banco. Les mandamos los datos ya formateados. Si no tenés un sistema de gestión, hay uno incluido. Registros automáticos, factura electrónica ARCA (ex AFIP) y liquidación de sueldos.</li>
        <li><strong>Neura Insight</strong> — Genera reportes para la toma de decisiones: dashboards por área, consultas en lenguaje natural, alertas proactivas y exportación a Excel o PDF.</li>
      </ul>

      <h2>Tablero Base</h2>
      <p>Cada módulo que activás viene con su Tablero Base ya configurado. No arrancás de cero: arrancás con la estructura del área funcionando, con KPIs, tablas, alertas y flujos listos desde el primer día.</p>

      <h2>Desafío 24hs</h2>
      <p>Hoy nos contás, mañana a las 8 tu equipo está operando. Día 0 a la mañana: kick-off, entendemos tus datos y procesos. Día 0 a la tarde: configuramos, cargamos datos y activamos integraciones. Día 1 a las 8:00 AM: tu equipo entra, hace un tutorial de 15 minutos y empieza a operar. Sin implementaciones de seis meses, sin consultoras, sin permanencia.</p>

      <h2>Para quién es</h2>
      <p>No es solo para PyMEs: es para cualquier empresa que opera. Distribución y logística, retail y mayoristas, servicios B2B, industria y manufactura, construcción, salud y profesionales, y agro. El caos operativo no tiene rubro.</p>

      <h2>Cómo trabajamos</h2>
      <ul>
        <li><strong>Producto ya desarrollado</strong> — fee de instalación único más suscripción mensual por uso y soporte. En 24 horas estás operando.</li>
        <li><strong>Customización sobre Neura Orkesta</strong> — adaptamos la plataforma a los procesos de tu empresa: flujos, formularios, integraciones y reportes a medida.</li>
        <li><strong>Desarrollo a medida</strong> — para lo que va más allá de la plataforma estándar. Presupuesto por proyecto, por etapas.</li>
